name: Release regression rehearsal

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
  workflow_call:
    inputs:
      analytics_only:
        description: Run only the Analytics PostgreSQL rehearsals
        type: boolean
        default: false

permissions: {}

jobs:
  core-rehearsals:
    if: ${{ !inputs.analytics_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pymentor_test
          POSTGRES_PASSWORD: pymentor_test
          POSTGRES_DB: pymentor_test
        ports: ['127.0.0.1:57382:5432']
        options: >-
          --health-cmd "pg_isready -U pymentor_test -d pymentor_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/core-api/requirements-dev.txt
      - name: Rehearse c503 backup restore and c504 migration
        id: c504
        run: python tooling/ci/rehearse_c504_backup.py --container '${{ job.services.postgres.id }}' --output '${{ runner.temp }}/c504-backup-rehearsal'
      - name: Rehearse c528 cutover and verified return
        id: c528
        run: python tooling/ci/rehearse_c528_cutover.py --execute
      - name: Record Core results
        if: ${{ always() }}
        env:
          C504: ${{ steps.c504.outcome }}
          C528: ${{ steps.c528.outcome }}
        run: |
          {
            echo '## Core synthetic rehearsals'
            echo "Source SHA: $GITHUB_SHA"
            echo "c504 backup and migration: $C504"
            echo "c528 cutover and return: $C528"
          } >> "$GITHUB_STEP_SUMMARY"

  analytics-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ANALYTICS_RUN_ACTIVITY_DAY_PROJECTION_SYNTHETIC: '1'
      ANALYTICS_RUN_FULL_RESTORE_SYNTHETIC: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/analytics/requirements-dev.txt
      - name: Create isolated synthetic PostgreSQL
        working-directory: services/analytics
        run: |
          python -B tools/setup_local_postgres.py
          docker run -d \
            --env-file .local/postgres.env -p 127.0.0.1:57392:5432 postgres:16 > "$RUNNER_TEMP/analytics-postgres-id"
          container=$(cat "$RUNNER_TEMP/analytics-postgres-id")
          [[ "$container" =~ ^[0-9a-f]{64}$ ]]
          printf 'ANALYTICS_SYNTHETIC_PG_CONTAINER_ID=%s\n' "$container" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U analytics_bootstrap -d analytics_bootstrap; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Exercise migrations and actual PostgreSQL archive restore
        id: restore
        working-directory: services/analytics
        run: |
          python -B -m pytest tests/activity_day_projection/test_a014_full_restore_pg.py -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/analytics-restore.xml"
          python - "$RUNNER_TEMP/analytics-restore.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = root.findall('.//testcase')
          if len(cases) != 1 or any(case.find('skipped') is not None for case in cases):
              raise SystemExit('Expected exactly one executed restore test; skipped or missing')
          PY
      - name: Exercise projection with a bounded 50-subject workload
        id: capacity
        working-directory: services/analytics
        env:
          ANALYTICS_RUN_ACTIVITY_PROJECTION_SYNTHETIC: '1'
          ANALYTICS_RUN_ACTIVITY_MONTH_SAMPLE: '1'
        run: |
          set -euo pipefail
          python -B -m pytest tests/activity_projection/test_projection_reports_pg.py::test_sparse_31day_50subject_explain \
            -q -s -p no:cacheprovider --junitxml="$RUNNER_TEMP/analytics-capacity.xml" \
            | tee "$RUNNER_TEMP/analytics-capacity.log"
          python - "$RUNNER_TEMP/analytics-capacity.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).getroot().findall('.//testcase')
          if len(cases) != 1 or any(case.find('skipped') is not None for case in cases):
              raise SystemExit('Expected exactly one executed capacity test; skipped or missing')
          PY
      - name: Record Analytics results and scope
        if: ${{ always() }}
        env:
          RESTORE: ${{ steps.restore.outcome }}
          CAPACITY: ${{ steps.capacity.outcome }}
        run: |
          {
            echo '## Analytics synthetic rehearsal'
            echo "Source SHA: $GITHUB_SHA"
            echo "a014 migration and custom archive restore: $RESTORE"
            echo "31-day projection sample (50 subjects, 12,400 facts): $CAPACITY"
            echo 'Full HTTP load profile: operator benchmark on isolated Windows resources, see docs/analytics/benchmark-runbook.md.'
            echo 'This restore test does not establish production recovery, RPO/RTO or performance acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Analytics test result
        if: ${{ always() && steps.restore.outcome != 'skipped' }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: analytics-rehearsal-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/analytics-restore.xml
            ${{ runner.temp }}/analytics-capacity.xml
            ${{ runner.temp }}/analytics-capacity.log
          if-no-files-found: warn
          retention-days: 14
      - name: Remove disposable PostgreSQL
        if: ${{ always() }}
        run: |
          if [ -s "$RUNNER_TEMP/analytics-postgres-id" ]; then
            docker rm -f "$(cat "$RUNNER_TEMP/analytics-postgres-id")"
          fi
