name: Analytics CI

on:
  pull_request:
    paths:
      - '.github/workflows/analytics-ci.yml'
      - 'services/analytics/**'
      - 'infra/analytics-local/**'
      - 'infra/helm/analytics/**'
      - 'infra/gitops/analytics/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      verify_image:
        description: Build and verify a local image when this run has no published candidate
        type: boolean
        default: true

permissions: {}

concurrency:
  group: analytics-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: services/analytics
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.16'
      - name: Install independent pinned dependencies
        run: python -m pip install -r services/analytics/requirements-dev.txt
      - name: Install Core dependencies in a separate fixture environment
        run: |
          core_venv="$RUNNER_TEMP/analytics-core-fixture"
          python -m venv "$core_venv"
          "$core_venv/bin/python" -m pip install -r services/core-api/requirements-dev.txt
          echo "KNOWI_ANALYTICS_CI_CORE_PYTHON=$core_venv/bin/python" >> "$GITHUB_ENV"
      - name: Check dependency consistency and contracts
        run: |
          python -m pip check
          python -B services/analytics/tools/export_contracts.py --check
          python -B services/analytics/tools/export_catalog.py --check
          python -B services/analytics/tools/check_profile.py
      - name: Run isolated unit, contract and lifecycle checks
        run: python -B -m pytest services/analytics/tests -q -p no:cacheprovider
      - name: Exercise protected Query, deletion replay and archive restore on isolated PostgreSQL
        shell: bash
        env:
          ANALYTICS_RUN_SYNTHETIC_PRIVACY_INTEGRATION: '1'
          ANALYTICS_RUN_ACTIVITY_DAY_PROJECTION_SYNTHETIC: '1'
          ANALYTICS_RUN_FULL_RESTORE_SYNTHETIC: '1'
        run: |
          set -euo pipefail
          python -B services/analytics/tools/setup_local_postgres.py
          archive_override="$RUNNER_TEMP/analytics-archive.compose.yaml"
          cat > "$archive_override" <<'YAML'
          services:
            analytics-postgres:
              labels:
                knowi.scope: a014-rollback-qa
          YAML
          pg=(docker compose -p knowi-analytics-01a1df75 -f infra/analytics-local/compose.postgres.yaml -f "$archive_override")
          trap '"${pg[@]}" down --volumes' EXIT
          "${pg[@]}" up -d --wait
          container=$("${pg[@]}" ps -q analytics-postgres)
          export ANALYTICS_SYNTHETIC_ARCHIVE_CONTAINER
          ANALYTICS_SYNTHETIC_ARCHIVE_CONTAINER=$(docker inspect --format '{{.Id}}' "$container")
          python -B -m pytest -q -rs -p no:cacheprovider \
            services/analytics/tests/privacy_authority/test_production_chain_synthetic.py::test_protected_dual_delivery_and_purge \
            services/analytics/tests/privacy_authority/test_protected_query_http_pg.py \
            services/analytics/tests/activity_day_projection/test_a014_full_restore_pg.py
      - name: Build isolated application image
        if: github.event_name != 'push' || inputs.verify_image
        run: docker build -t knowi-analytics:ci services/analytics
      - name: Check all image entrypoints without network access
        if: github.event_name != 'push' || inputs.verify_image
        run: python -B services/analytics/tools/check_image.py knowi-analytics:ci
      - name: Validate separate Helm release
        shell: bash
        run: |
          helm_cli="$RUNNER_TEMP/knowi-analytics-helm"
          cat > "$helm_cli" <<'SH'
          #!/usr/bin/env bash
          exec docker run --rm --network none -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" alpine/helm:3.19.0 "$@"
          SH
          chmod 0700 "$helm_cli"
          "$helm_cli" lint "$GITHUB_WORKSPACE/infra/helm/analytics" --strict --namespace knowi-analytics
          python infra/helm/analytics/test_render.py "$helm_cli"
