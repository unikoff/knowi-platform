<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1b1b1b">
  <link rel="icon" href="data:,">
  <title>Технические работы — knowi</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #1b1b1b;
      --border: #3a3a3a;
      --text: #ededee;
      --muted: #b3b3b3;
      --accent: #b7ff5a;
      font-family: Manrope, "Nunito Sans", "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: clamp(16px, 5vw, 48px);
      place-items: center;
      background: var(--background);
      color: var(--text);
    }

    main {
      width: min(100%, 640px);
      padding: clamp(26px, 8vw, 60px);
      border: 1px solid var(--border);
      border-radius: clamp(24px, 5vw, 36px);
      background: radial-gradient(ellipse at top right, #2b3223, transparent 50%), #202020;
      box-shadow: 0 28px 90px #0004;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #edefe8;
      font-size: 1.75rem;
      font-weight: 750;
      letter-spacing: -.05em;
      line-height: 1;
    }

    .brand svg { width: 36px; height: 36px; }

    h1 {
      max-width: 17ch;
      margin: clamp(32px, 7vw, 56px) 0 0;
      font-size: clamp(2rem, 6.5vw, 3.375rem);
      font-weight: 700;
      letter-spacing: -.045em;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    p {
      max-width: 38ch;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.125rem);
      line-height: 1.6;
    }

    .retry {
      display: inline-flex;
      min-height: 48px;
      margin-top: 30px;
      padding: 10px 18px;
      align-items: center;
      gap: 9px;
      border: 1px solid #566342;
      border-radius: 999px;
      background: #293023;
      color: var(--text);
      font-weight: 600;
      line-height: 1.4;
      text-decoration: none;
    }

    .retry:hover { background: #36432b; }
    .retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .retry span { color: var(--accent); font-size: 1.3em; line-height: 1; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <!-- Inline knowi-symbol-on-dark.svg so the page needs only this file. -->
      <svg viewBox="0 0 256 256" aria-hidden="true" focusable="false">

          <path fill="#B7FF5A" d="M 47.64 63.275 L 179.55 36.497 Q 182 36 184.349 36.855 L 240.711 57.371 Q 244 58.568 244 62.068 L 244 73.068 Q 244 76.568 240.57 77.264 L 128.86 99.941 Q 122 101.334 122 108.334 L 122 119.334 Q 122 126.334 128.86 124.941 L 240.57 102.264 Q 244 101.568 244 105.068 L 244 116.068 Q 244 119.568 240.57 120.264 L 117.9 145.166 Q 113 146.161 108.302 144.451 L 46.914 122.106 Q 30 115.949 30 97.949 L 30 84.856 Q 30 66.856 47.64 63.275 Z"/>
        </g>
      </svg>
      knowi
    </div>
    <h1>Идут технические работы</h1>
    <p>Платформа временно недоступна. Попробуйте зайти чуть позже.</p>
    <a class="retry" href=""><span aria-hidden="true">↻</span> Обновить страницу</a>
  </main>
</body>
</html>
