[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pymentor-analytics"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.139.0", "pydantic==2.13.4", "uvicorn==0.50.0", "SQLAlchemy==2.0.51", "asyncpg==0.32.0", "psycopg[binary]==3.3.8", "alembic==1.20.1", "PyJWT==2.15.1", "cryptography==50.0.2"]

[project.scripts]
analytics = "pymentor_analytics.app.cli:main"

[tool.setuptools.packages.find]
include = ["pymentor_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
