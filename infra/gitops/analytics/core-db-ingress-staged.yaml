# Review-only additive policy. Database owner controls this namespace and source;
# this is not part of the Analytics Argo Application and does not replace rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-analytics-private-core-source
  namespace: pymentor-rehearsal-data-20261109
spec:
  podSelector:
    matchLabels: {app: rehearsal-postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: knowi-analytics}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: analytics-core-source
              app.kubernetes.io/instance: analytics
      ports: [{protocol: TCP, port: 57152}]
