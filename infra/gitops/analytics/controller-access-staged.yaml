# Bootstrap after namespace creation, outside the Analytics Application.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-analytics-controller
  namespace: knowi-analytics
rules:
  - apiGroups: ['']
    resources: [serviceaccounts, services, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-analytics-controller
  namespace: knowi-analytics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-analytics-controller
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd-preview
