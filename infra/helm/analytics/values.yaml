image:
  repository: knowi-analytics
  tag: an1-local
  digest: "" # Optional immutable manifest digest; takes precedence over tag.
  pullPolicy: IfNotPresent

# Additional fail-closed checks for the staged single-VPS profile.
knowi01Staged:
  enabled: false

# Optional production Analytics PostgreSQL server verification.
analyticsDatabaseTLS:
  enabled: false
  caSecretName: "" # Secret key: ca.crt

# Opt-in only for a fresh, synthetic benchmark namespace.
syntheticBenchmark:
  enabled: false

# One trusted public-key manifest source for all roles; no private signing keys.
trustManifest:
  configMapName: ""
  key: TRUST_MANIFEST_JSON

# Public synthetic v2 snapshots only; collector receives this optional fixture.
fixtureCatalog:
  configMapName: ""
  key: FIXTURE_CATALOG_JSON

# Common private reader configuration; never place credentials in values or a ConfigMap.
privacyAuthority:
  secretName: ""
  key: PRIVACY_AUTHORITY_JSON

# Optional a007+ features; ConfigMaps contain public metadata only.
coreTransfer:
  enabled: false
  proofEnabled: false
  statusSecretName: ""
  namespacesConfigMapName: ""
  namespacesKey: CORE_TRANSFER_NAMESPACES_JSON
  queryNamespace: ""
  rosterSecretName: ""
  rosterKey: CORE_TRANSFER_ROSTER_JSON
catalog:
  enabled: false
  namespace: ""
browserCollection:
  enabled: false # Prepared only; enable after restore quarantine verification.
activityProjection:
  enabled: false
  runId: "" # Stable per dataset generation, shared by Processor and Query.
  processorPollMs: 500 # Bounds match PROCESSOR_ACTIVITY_POLL_SECONDS in the runtime.
activityDay:
  enabled: false # a011 day worker and Query; requires activityProjection and Privacy.
activityCourse:
  enabled: false # a012+ course worker and Query; requires activityDay.
activityBoundaryCredit:
  enabled: false # a013+ boundary worker; requires activityCourse.

roles:
  collector:
    replicas: 1
    imageTag: "" # Optional independent role rollout; empty uses image.tag.
    secretName: analytics-collector-db
    poolSize: 2
    poolOverflow: 0
    concurrency: 4
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
  processor:
    replicas: 1
    imageTag: "" # Optional independent role rollout; empty uses image.tag.
    secretName: analytics-processor-db
    poolSize: 2
    poolOverflow: 0
    concurrency: 4
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
  query:
    replicas: 1
    imageTag: "" # Optional independent role rollout; empty uses image.tag.
    secretName: analytics-query-db
    poolSize: 2
    poolOverflow: 0
    concurrency: 4
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
  privacy:
    enabled: false
    replicas: 1
    imageTag: "" # Optional independent role rollout; empty uses image.tag.
    secretName: analytics-privacy-db
    poolSize: 1
    poolOverflow: 0
    concurrency: 4
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 128Mi}

migration:
  enabled: false
  revision: a006
  secretName: analytics-migrate-db
  poolSize: 1
  poolOverflow: 0
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

network:
  # Empty means database egress remains denied; configure the actual Analytics DB /32 or specific CIDR.
  databaseCIDR: ""
  databasePort: 5432
  authorityCIDR: ""
  authorityPort: 57420
  dnsNamespace: kube-system
  dnsPodLabels: {k8s-app: kube-dns}
  ingressNamespace: kube-system
  ingressPodLabels: {app.kubernetes.io/name: traefik}
  coreIngress:
    enabled: false
    namespace: ""
    podLabels: {}
    cidr: "" # Alternative to namespace and pod labels: one exact IP only.

ingress:
  enabled: false
  host: analytics.local
  entryPoint: websecure
  tlsSecretName: ""

# Disabled until dedicated, independently recoverable stores and mTLS Secrets exist.
authorityServer:
  enabled: false
  configSecretName: "" # Includes config.json and the referenced key/certificate files.
  journalClaimName: "" # Pre-provisioned, initialized, non-disposable PVC.
  anchorBackend: postgres # Config Secret must use postgres; provision independently.
  anchorCIDR: "" # Exact address of independent, TLS-verified anchor PostgreSQL.
  anchorPort: 5432
  port: 57420
  coreNamespace: ""
  corePodLabels: {}
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# mTLS material referenced by the authority client JSON. Never values or ConfigMap.
authorityClientTLS:
  secretName: ""

# Production profile only wires authenticated guards; collection remains off.
runtime:
  mode: synthetic
  hostBootRecoveryGate: false  # Operator-controlled volatile permit for a single-node installation.
coreDeletion:
  sourceSecretName: "" # key CORE_DELETION_SOURCE_JSON
  statusSecretName: "" # key DATABASE_URL; dedicated transfer-status DB role
  relaySecretName: "" # key CORE_DELETION_RELAY_JSON, privacy role only
  tlsSecretName: "" # source client certificates; paths referenced by source JSON
  namespace: ""
  podLabels: {}
  port: 8000

# Production Core-to-Analytics mTLS, disabled until image and certificates exist.
internalTLS:
  enabled: false
  proxyImageRepository: "" # Release-scanned frontend image, which contains nginx.
  proxyImageDigest: ""
  collectorSecretName: "" # tls.crt, tls.key, ca.crt; server SAN is Collector Service DNS.
  querySecretName: "" # Distinct key and certificate, Query Service DNS SAN.
  port: 8443

privateCoreSource:
  enabled: false
  imageRepository: ""
  imageDigest: ""
  databaseSecretName: "" # DATABASE_URL with verify-full and sslrootcert
  hmacSecretName: "" # key named hmac.key, 32-byte base64url without newline
  databaseCASecretName: "" # key named ca.crt
  serverTLSSecretName: "" # keys tls.crt, tls.key, ca.crt
  expectedHost: ""
  expectedDatabase: ""
  expectedUser: ""
  instanceId: ""
  databaseCIDR: "" # Exact independent Core DB address.
  databaseNamespace: "" # Alternative to databaseCIDR: namespace plus Pod labels.
  databasePodLabels: {}
  databasePort: 5432
