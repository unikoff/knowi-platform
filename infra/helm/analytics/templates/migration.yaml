{{- if .Values.migration.enabled }}
{{- include "analytics.guard" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-analytics-migrate
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-analytics-migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app.kubernetes.io/name: analytics, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: migrate}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-analytics-migrate
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: {{ if .Values.image.digest }}{{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}{{ else }}{{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "--revision", {{ .Values.migration.revision | quote }}]
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-analytics-config}
          env:
{{- if eq .Values.runtime.mode "production" }}
            - name: ANALYTICS_TRUST_MANIFEST_JSON
              valueFrom:
                configMapKeyRef: {name: {{ .Values.trustManifest.configMapName | quote }}, key: {{ .Values.trustManifest.key | quote }}}
            - name: ANALYTICS_PRIVACY_AUTHORITY_JSON
              valueFrom:
                secretKeyRef: {name: {{ .Values.privacyAuthority.secretName | quote }}, key: {{ .Values.privacyAuthority.key | quote }}}
            - name: ANALYTICS_CORE_DELETION_SOURCE_JSON
              valueFrom:
                secretKeyRef: {name: {{ .Values.coreDeletion.sourceSecretName | quote }}, key: CORE_DELETION_SOURCE_JSON}
{{- end }}
            - name: ANALYTICS_MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.migration.secretName }}, key: DATABASE_URL}
{{- if eq .Values.runtime.mode "production" }}
          volumeMounts:
            - {name: authority-client-tls, mountPath: /var/run/analytics-authority-tls, readOnly: true}
            - {name: core-deletion-tls, mountPath: /var/run/core-deletion-tls, readOnly: true}
{{- end }}
          resources:
{{ toYaml .Values.migration.resources | indent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
{{- if eq .Values.runtime.mode "production" }}
      volumes:
        - name: authority-client-tls
          secret: {secretName: {{ .Values.authorityClientTLS.secretName | quote }}}
        - name: core-deletion-tls
          secret: {secretName: {{ .Values.coreDeletion.tlsSecretName | quote }}}
{{- end }}
{{- end }}
