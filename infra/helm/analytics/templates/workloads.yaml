{{- range $role, $cfg := .Values.roles }}
{{- if or (ne $role "privacy") $cfg.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-analytics-{{ $role }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-analytics-{{ $role }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: analytics, app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $role }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: analytics, app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $role }}}
    spec:
      serviceAccountName: {{ $.Release.Name }}-analytics-{{ $role }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ $role }}
          image: {{ if $.Values.image.digest }}{{ printf "%s@%s" $.Values.image.repository $.Values.image.digest | quote }}{{ else }}{{ printf "%s:%s" $.Values.image.repository (default $.Values.image.tag $cfg.imageTag) | quote }}{{ end }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [{{ $role | quote }}, "--host", {{ if and (eq $.Values.runtime.mode "production") (has $role (list "collector" "query")) }}"127.0.0.1"{{ else }}"0.0.0.0"{{ end }}, "--port", "8000"]
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: {{ $.Release.Name }}-analytics-config}
          env:
{{- if $.Values.analyticsDatabaseTLS.enabled }}
            - {name: PGSSLMODE, value: "verify-full"}
            - {name: PGSSLROOTCERT, value: "/var/run/analytics-db-ca/ca.crt"}
            - {name: PGGSSENCMODE, value: "disable"}
{{- end }}
{{- if $.Values.runtime.hostBootRecoveryGate }}
            - {name: ANALYTICS_{{ upper $role }}_HOST_BOOT_RECOVERY_GATE, value: "true"}
{{- end }}
{{- if and $.Values.coreTransfer.enabled (has $role (list "collector" "processor" "query")) }}
            - {name: ANALYTICS_{{ upper $role }}_CORE_TRANSFER_ENABLED, value: "true"}
{{- if $.Values.coreTransfer.proofEnabled }}
            - {name: ANALYTICS_{{ upper $role }}_CORE_TRANSFER_PROOF_ENABLED, value: "true"}
{{- end }}
{{- if eq $role "collector" }}
            - name: ANALYTICS_COLLECTOR_CORE_TRANSFER_STATUS_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ $.Values.coreTransfer.statusSecretName | quote }}, key: DATABASE_URL}
{{- end }}
{{- if eq $role "query" }}
            - {name: ANALYTICS_QUERY_CORE_TRANSFER_NAMESPACE, value: {{ $.Values.coreTransfer.queryNamespace | quote }}}
{{- if $.Values.coreTransfer.rosterSecretName }}
            - name: ANALYTICS_QUERY_CORE_TRANSFER_ROSTER_JSON
              valueFrom:
                secretKeyRef: {name: {{ $.Values.coreTransfer.rosterSecretName | quote }}, key: {{ $.Values.coreTransfer.rosterKey | quote }}}
{{- end }}
{{- end }}
{{- end }}
{{- if and (eq $role "collector") (or $.Values.coreTransfer.enabled $.Values.catalog.enabled) }}
            - name: ANALYTICS_COLLECTOR_CORE_TRANSFER_NAMESPACES_JSON
              valueFrom:
                configMapKeyRef: {name: {{ $.Values.coreTransfer.namespacesConfigMapName | quote }}, key: {{ $.Values.coreTransfer.namespacesKey | quote }}}
{{- end }}
{{- if and (eq $role "collector") $.Values.catalog.enabled }}
            - {name: ANALYTICS_COLLECTOR_CATALOG_ENABLED, value: "true"}
            - {name: ANALYTICS_COLLECTOR_CATALOG_NAMESPACE, value: {{ $.Values.catalog.namespace | quote }}}
{{- end }}
{{- if and $.Values.activityProjection.enabled (has $role (list "processor" "query")) }}
            - {name: ANALYTICS_{{ upper $role }}_ACTIVITY_PROJECTION_ENABLED, value: "true"}
            - {name: ANALYTICS_ACTIVITY_PROJECTION_RUN_ID, value: {{ $.Values.activityProjection.runId | quote }}}
{{- end }}
{{- if and $.Values.activityProjection.enabled (eq $role "processor") }}
            - {name: ANALYTICS_PROCESSOR_ACTIVITY_POLL_SECONDS, value: {{ divf $.Values.activityProjection.processorPollMs 1000 | quote }}}
{{- end }}
{{- if and $.Values.activityDay.enabled (eq $role "processor") }}
            - {name: ANALYTICS_PROCESSOR_ACTIVITY_DAY_WORKER_ENABLED, value: "true"}
{{- end }}
{{- if and $.Values.activityDay.enabled (eq $role "query") }}
            - {name: ANALYTICS_QUERY_ACTIVITY_DAY_QUERY_ENABLED, value: "true"}
{{- end }}
{{- if and $.Values.activityCourse.enabled (eq $role "processor") }}
            - {name: ANALYTICS_PROCESSOR_ACTIVITY_COURSE_WORKER_ENABLED, value: "true"}
{{- end }}
{{- if and $.Values.activityCourse.enabled (eq $role "query") }}
            - {name: ANALYTICS_QUERY_ACTIVITY_COURSE_QUERY_ENABLED, value: "true"}
{{- end }}
{{- if and $.Values.activityBoundaryCredit.enabled (eq $role "processor") }}
            - {name: ANALYTICS_PROCESSOR_ACTIVITY_BOUNDARY_CREDIT_ENABLED, value: "true"}
{{- end }}
{{- if $.Values.trustManifest.configMapName }}
            - name: ANALYTICS_TRUST_MANIFEST_JSON
              valueFrom:
                configMapKeyRef:
                  name: {{ $.Values.trustManifest.configMapName | quote }}
                  key: {{ $.Values.trustManifest.key | quote }}
{{- end }}
{{- if and (eq $role "collector") $.Values.fixtureCatalog.configMapName }}
            - name: ANALYTICS_FIXTURE_CATALOG_JSON
              valueFrom:
                configMapKeyRef:
                  name: {{ $.Values.fixtureCatalog.configMapName | quote }}
                  key: {{ $.Values.fixtureCatalog.key | quote }}
{{- end }}
{{- if $.Values.privacyAuthority.secretName }}
            - name: ANALYTICS_PRIVACY_AUTHORITY_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.privacyAuthority.secretName | quote }}
                  key: {{ $.Values.privacyAuthority.key | quote }}
{{- end }}
{{- if eq $.Values.runtime.mode "production" }}
            - name: ANALYTICS_CORE_DELETION_SOURCE_JSON
              valueFrom:
                secretKeyRef: {name: {{ $.Values.coreDeletion.sourceSecretName | quote }}, key: CORE_DELETION_SOURCE_JSON}
{{- if eq $role "privacy" }}
            - name: ANALYTICS_PRIVACY_CORE_DELETION_RELAY_JSON
              valueFrom:
                secretKeyRef: {name: {{ $.Values.coreDeletion.relaySecretName | quote }}, key: CORE_DELETION_RELAY_JSON}
{{- else }}
            - name: ANALYTICS_{{ upper $role }}_CORE_DELETION_STATUS_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ $.Values.coreDeletion.statusSecretName | quote }}, key: DATABASE_URL}
{{- end }}
{{- end }}
            - name: ANALYTICS_{{ upper $role }}_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ $cfg.secretName }}, key: DATABASE_URL}
{{- if and (eq $role "processor") $.Values.studentWindows.proofSecretName }}
            - {name: ANALYTICS_WINDOWS_RECONCILIATION_PROOF_FILE, value: "/var/run/analytics-windows-proof/coverage.json"}
{{- end }}
            - {name: FORWARDED_ALLOW_IPS, value: ""}
{{- if or $.Values.authorityClientTLS.secretName (eq $.Values.runtime.mode "production") $.Values.analyticsDatabaseTLS.enabled (and (eq $role "processor") $.Values.studentWindows.proofSecretName) }}
          volumeMounts:
{{- if and (eq $role "processor") $.Values.studentWindows.proofSecretName }}
            - {name: student-windows-proof, mountPath: /var/run/analytics-windows-proof, readOnly: true}
{{- end }}
{{- if $.Values.analyticsDatabaseTLS.enabled }}
            - {name: analytics-db-ca, mountPath: /var/run/analytics-db-ca, readOnly: true}
{{- end }}
{{- if $.Values.authorityClientTLS.secretName }}
            - {name: authority-client-tls, mountPath: /var/run/analytics-authority-tls, readOnly: true}
{{- end }}
{{- if eq $.Values.runtime.mode "production" }}
            - {name: core-deletion-tls, mountPath: /var/run/core-deletion-tls, readOnly: true}
{{- end }}
{{- if $.Values.runtime.hostBootRecoveryGate }}
            - {name: recovery-permit, mountPath: /var/run/analytics-recovery, readOnly: true}
{{- end }}
{{- end }}
          resources:
{{ toYaml $cfg.resources | indent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
{{- if and (eq $.Values.runtime.mode "production") (has $role (list "collector" "query")) }}
          livenessProbe: {exec: {command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=2).read()"]}, periodSeconds: 10, timeoutSeconds: 3}
          readinessProbe: {exec: {command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read()"]}, periodSeconds: 5, timeoutSeconds: 6}
        - name: internal-tls
          image: {{ printf "%s@%s" $.Values.internalTLS.proxyImageRepository $.Values.internalTLS.proxyImageDigest | quote }}
          command: ["nginx", "-c", {{ printf "/etc/analytics-tls/%s.conf" $role | quote }}, "-g", "daemon off;"]
          ports: [{name: https, containerPort: {{ $.Values.internalTLS.port }}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {tcpSocket: {port: https}, periodSeconds: 5, timeoutSeconds: 3}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: internal-tls-config, mountPath: /etc/analytics-tls, readOnly: true}
            - {name: internal-tls-server, mountPath: /var/run/server-tls, readOnly: true}
            - {name: internal-tls-tmp, mountPath: /tmp}
{{- else }}
          livenessProbe: {httpGet: {path: /live, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5, timeoutSeconds: 6}
{{- end }}
{{- if or $.Values.authorityClientTLS.secretName (eq $.Values.runtime.mode "production") $.Values.analyticsDatabaseTLS.enabled (and (eq $role "processor") $.Values.studentWindows.proofSecretName) }}
      volumes:
{{- if and (eq $role "processor") $.Values.studentWindows.proofSecretName }}
        - name: student-windows-proof
          secret:
            secretName: {{ $.Values.studentWindows.proofSecretName | quote }}
            items:
              - {key: {{ $.Values.studentWindows.proofSecretKey | quote }}, path: coverage.json}
{{- end }}
{{- if $.Values.analyticsDatabaseTLS.enabled }}
        - name: analytics-db-ca
          secret: {secretName: {{ $.Values.analyticsDatabaseTLS.caSecretName | quote }}, items: [{key: ca.crt, path: ca.crt}]}
{{- end }}
{{- if $.Values.authorityClientTLS.secretName }}
        - name: authority-client-tls
          secret: {secretName: {{ $.Values.authorityClientTLS.secretName | quote }}}
{{- end }}
{{- if $.Values.runtime.hostBootRecoveryGate }}
        - name: recovery-permit
          hostPath: {path: /run/knowi-analytics-recovery, type: Directory}
{{- end }}
{{- if eq $.Values.runtime.mode "production" }}
        - name: core-deletion-tls
          secret: {secretName: {{ $.Values.coreDeletion.tlsSecretName | quote }}}
{{- if has $role (list "collector" "query") }}
        - name: internal-tls-config
          configMap: {name: {{ $.Release.Name }}-analytics-internal-tls}
        - name: internal-tls-server
          secret: {secretName: {{ if eq $role "collector" }}{{ $.Values.internalTLS.collectorSecretName | quote }}{{ else }}{{ $.Values.internalTLS.querySecretName | quote }}{{ end }}, defaultMode: 0440}
        - name: internal-tls-tmp
          emptyDir: {sizeLimit: 16Mi}
{{- end }}
{{- end }}
{{- end }}
{{- if or (eq $role "collector") (eq $role "query") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-analytics-{{ $role }}
spec:
  selector: {app.kubernetes.io/name: analytics, app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $role }}}
{{- if eq $.Values.runtime.mode "production" }}
  ports: [{name: https, port: {{ $.Values.internalTLS.port }}, targetPort: https}]
{{- else }}
  ports: [{name: http, port: 8000, targetPort: http}]
{{- end }}
{{- end }}
{{- end }}
{{- end }}
