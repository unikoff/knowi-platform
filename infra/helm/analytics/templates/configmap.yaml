{{- include "analytics.guard" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-analytics-config
data:
{{- range $role, $cfg := .Values.roles }}
{{- if or (ne $role "privacy") $cfg.enabled }}
  ANALYTICS_{{ upper $role }}_POOL_SIZE: {{ $cfg.poolSize | quote }}
  ANALYTICS_{{ upper $role }}_POOL_OVERFLOW: {{ $cfg.poolOverflow | quote }}
  ANALYTICS_{{ upper $role }}_CONCURRENCY: {{ $cfg.concurrency | quote }}
  ANALYTICS_{{ upper $role }}_ISSUER_MODE: {{ $.Values.runtime.mode | quote }}
  ANALYTICS_{{ upper $role }}_REAL_COLLECTION: {{ and (eq $role "collector") $.Values.browserCollection.enabled | quote }}
{{- end }}
{{- end }}
{{- if eq .Values.runtime.mode "production" }}
  ANALYTICS_PROCESSOR_BUCKET_WORKER_ENABLED: {{ .Values.activityProjection.enabled | quote }}
  ANALYTICS_PROCESSOR_GENERIC_WORKER_ENABLED: "false"
{{- end }}
  ANALYTICS_WINDOWS_INTAKE_ENABLED: {{ ternary "1" "0" .Values.studentWindows.intakeEnabled | quote }}
  ANALYTICS_WINDOWS_RECONCILIATION_ENABLED: {{ ternary "1" "0" .Values.studentWindows.reconciliationEnabled | quote }}
  ANALYTICS_WINDOWS_ALL_ELIGIBLE: {{ ternary "1" "0" .Values.studentWindows.allEligible | quote }}
  ANALYTICS_WINDOWS_COHORT: {{ .Values.studentWindows.cohort | quote }}
  ANALYTICS_WINDOWS_T0: {{ .Values.studentWindows.observationStart | quote }}
  ANALYTICS_MIGRATE_POOL_SIZE: {{ .Values.migration.poolSize | quote }}
  ANALYTICS_MIGRATE_POOL_OVERFLOW: {{ .Values.migration.poolOverflow | quote }}
  ANALYTICS_MIGRATE_ISSUER_MODE: {{ .Values.runtime.mode | quote }}
  ANALYTICS_MIGRATE_REAL_COLLECTION: "false"
