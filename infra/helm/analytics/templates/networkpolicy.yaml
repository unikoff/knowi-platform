{{- if or (eq .Values.network.databaseCIDR "0.0.0.0/0") (eq .Values.network.databaseCIDR "::/0") }}
{{- fail "databaseCIDR must be a restricted Analytics database network" }}
{{- end }}
{{- if or (eq .Values.network.authorityCIDR "0.0.0.0/0") (eq .Values.network.authorityCIDR "::/0") }}
{{- fail "authorityCIDR must be a restricted synthetic authority address" }}
{{- end }}
{{- range $cidr := list .Values.network.databaseCIDR .Values.network.authorityCIDR }}
{{- $exactIPv4 := regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/32$" $cidr }}
{{- $exactIPv6 := regexMatch "^[0-9A-Fa-f:]+/128$" $cidr }}
{{- if and $cidr (not (or $exactIPv4 $exactIPv6)) }}
{{- fail "Analytics external egress must select an exact IP address" }}
{{- end }}
{{- end }}
{{- if and .Values.network.authorityCIDR (eq .Values.network.databaseCIDR .Values.network.authorityCIDR) }}
{{- fail "Analytics database and independent authority must use distinct IP addresses" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-analytics-default-deny
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: analytics, app.kubernetes.io/instance: {{ .Release.Name }}}}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-analytics-dns-db
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: analytics, app.kubernetes.io/instance: {{ .Release.Name }}}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.network.dnsNamespace | quote }}}}
          podSelector:
            matchLabels:
{{ toYaml .Values.network.dnsPodLabels | indent 14 }}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- if .Values.network.databaseCIDR }}
    - to:
        - ipBlock: {cidr: {{ .Values.network.databaseCIDR | quote }}}
      ports: [{protocol: TCP, port: {{ .Values.network.databasePort }}}]
{{- end }}
{{- if .Values.network.authorityCIDR }}
    - to:
        - ipBlock: {cidr: {{ .Values.network.authorityCIDR | quote }}}
      ports: [{protocol: TCP, port: {{ .Values.network.authorityPort }}}]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-analytics-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: analytics, app.kubernetes.io/instance: {{ .Release.Name }}}
    matchExpressions: [{key: app.kubernetes.io/component, operator: In, values: [collector, query]}]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.network.ingressNamespace | quote }}}}
          podSelector:
            matchLabels:
{{ toYaml .Values.network.ingressPodLabels | indent 14 }}
      ports: [{protocol: TCP, port: 8000}]
{{- if .Values.network.coreIngress.enabled }}
{{- $core := .Values.network.coreIngress }}
{{- $cidrOK := or (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/32$" $core.cidr) (regexMatch "^[0-9A-Fa-f:]+/128$" $core.cidr) }}
{{- if or (and $core.cidr (or (not $cidrOK) $core.namespace $core.podLabels)) (and (not $core.cidr) (or (not $core.namespace) (not $core.podLabels))) }}
{{- fail "Core ingress requires either one exact IP or a namespace and non-empty pod selector" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-analytics-core-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: analytics, app.kubernetes.io/instance: {{ .Release.Name }}}
    matchExpressions: [{key: app.kubernetes.io/component, operator: In, values: [collector, query]}]
  policyTypes: [Ingress]
  ingress:
    - from:
{{- if $core.cidr }}
        - ipBlock: {cidr: {{ $core.cidr | quote }}}
{{- else }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $core.namespace | quote }}}}
          podSelector:
            matchLabels:
{{ toYaml $core.podLabels | indent 14 }}
{{- end }}
      ports: [{protocol: TCP, port: 8000}]
{{- end }}
